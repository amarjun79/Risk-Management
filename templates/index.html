<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RiskLens | Decline Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='llm.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='policy-links.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='risk-list.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='analyst-actions.css') }}">
</head>

<body>
    <main class="shell">
        <aside class="brand">
            <div class="brandmark">R</div>
            <div><strong>RiskLens</strong><span>Banking security</span></div>
        </aside>
        <section class="chat-panel">
            <header>
                <div>
                    <h1>AI INVESTIGATION ASSISTANT</h1>
                    <p class="sub">Get a clear, evidence-based explanation of a card transaction.</p>
                </div>
            </header>
            <section>
                <div id="messages" class="messages">
                    <article class="message bot">
                        <div class="avatar">R</div>
                        <div class="bubble">Hello! I am RiskLens AI. How can I help you today?</div>
                    </article>
                </div>
                <div class="sample"><span>Try an example</span><button
                        data-question="List all high risk transactions">List all high risk transactions</button><button
                        data-question="Why was TXN_20106 declined?">Why was TXN_20106 declined?</button><button
                        data-question="Check TXN_20208">Check TXN_20208</button></div>
                <form id="chat-form"><input id="message" autocomplete="off"
                        placeholder="Ask about a declined transaction..." aria-label="Your message"><button>Send
                        <span>↑</span></button></form>
            </section>
            <p class="notice">Information is based on transaction and policy evidence. Do not share card or account
                numbers.</p>
        </section>
    </main>
    <script>
        const messages = document.querySelector('#messages'), form = document.querySelector('#chat-form'), input = document.querySelector('#message'), esc = s => String(s).replace(/[&<>"']/g, x => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[x]));
        function signalWhy(signal, avgTransactionAmount) { let reasons = { 'Impossible travel': 'This suggests the card was used in two far-apart places too quickly for normal travel.', 'Anonymizing proxy': 'This can hide the real origin of the transaction and raises fraud concern.', 'Card-not-present': 'Online or remote purchases carry more fraud risk because the physical card was not verified.', 'Unusual spending pattern': 'A sudden spike in spending is treated as a warning sign against the usual profile.' }; if (signal.name === 'Unusual amount') { let avg = Number(avgTransactionAmount || 0); return avg > 0 ? `This amount is far above the usual average transaction amount of $${avg.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}, which can indicate unauthorized activity.` : 'A purchase far above the normal pattern can indicate unauthorized activity.' } return reasons[signal.name] || 'This pattern increased the fraud-risk score for the transaction.' }
        function user(t) { messages.insertAdjacentHTML('beforeend', `<article class="message user"><div class="bubble">${esc(t)}</div></article>`) }
        function card(r) {
            if (r.error) return `<article class="message bot"><div class="avatar">R</div><div class="bubble">${esc(r.error)}</div></article>`;
            if (r.mode === 'riskFilterPrompt') {
                let buttons = (r.options || []).map(o => `
                    <button type="button" class="risk-filter-button ${esc(o.badge || '')}" data-query="${esc(o.query)}">
                        <span class="dot-indicator"></span>
                        <span>${esc(o.label)}</span>
                    </button>
                `).join('');
                return `
                    <article class="message bot">
                        <div class="avatar">R</div>
                        <div class="card risk-list-card">
                            <div class="cardtop">
                                <div>
                                    <small>TRANSACTION REVIEW</small>
                                    <b>${esc(r.title)}</b>
                                </div>
                            </div>
                            <p style="margin:8px 0 14px;color:#496571;font-size:13px;line-height:1.45;">${esc(r.message)}</p>
                            <div class="risk-filter-actions">${buttons}</div>
                        </div>
                    </article>
                `;
            }
            if (r.mode === 'riskList') {
                let rows = (r.transactions || []).map(t => `<button type="button" class="risk-transaction-link" data-transaction-id="${esc(t.transactionId)}"><span><b>${esc(t.transactionId)} · ${esc(t.merchant)}</b><small>${esc(t.location)} · ${new Date(t.timestamp).toLocaleString()} · ${esc(t.reason)}</small></span><span class="risk ${String(t.riskLevel).toLowerCase()}">${esc(t.riskLevel)} <strong>${t.riskScore}</strong></span></button>`).join('') || '<p class="empty-risk-list">No transactions were found in this risk category.</p>';
                return `
                    <article class="message bot">
                        <div class="avatar">R</div>
                        <div class="card risk-list-card">
                            <div class="cardtop">
                                <div>
                                    <small>TRANSACTION REVIEW</small>
                                    <b>${esc(r.title)}</b>
                                </div>
                            </div>
                            <p style="margin:8px 0 12px;color:#496571;font-size:13px;line-height:1.45;">${esc(r.message)}</p>
                            <div class="risk-transaction-list">${rows}</div>
                        </div>
                    </article>
                `;
            }
            if (r.mode === 'policyQA') {
                let policies = (r.policies || []).map((p, i) => `<li class="policy-item"><button class="policy-link" type="button" data-target="policy-${i}" aria-expanded="false"><span class="p-title">${esc(p.section)}</span><span class="p-right"><span class="p-match">${p.relevance ? p.relevance + '% match' : ''}</span> <span>Details →</span></span></button><div id="policy-${i}" class="policy-detail" hidden><b>${esc(p.section)}</b><p>${esc(p.text)}</p></div></li>`).join('');
                let policySection = policies ? `<div class="col-head"><b>Related Policy Rule</b></div><ul class="policies-list">${policies}</ul>` : '';
                let llmBlock = r.llmExplanation ? `<div class="llm-explanation"><b>AI Policy Explanation</b><p>${esc(r.llmExplanation)}</p></div>` : '';
                return `<article class="message bot"><div class="avatar">R</div><div class="card"><div class="cardtop"><div><small>POLICY SEARCH</small><b>${esc(r.title)}</b></div><div class="risk low">Vector Match</div></div><p style="margin:6px 0 8px;color:#496571;font-size:12.5px;">${esc(r.summary)}</p>${llmBlock}${policySection}<div class="recommend-box"><small>TIP</small><p>${esc(r.recommendation)}</p></div></div></article>`;
            }
            if (r.mode === 'bubble' || (!r.transaction && r.message)) {
                return `<article class="message bot"><div class="avatar">R</div><div class="bubble">${esc(r.message)}</div></article>`;
            }

            let isClean = !r.signals || r.signals.length === 0;

            let kpis = r.transaction ? `
            <div class="txn-kpis">
                <div class="kpi-item"><small>AMOUNT & BASELINE</small><b>$${Number(r.transaction.amount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</b><span>Avg: $${Number(r.avgTransactionAmount).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span></div>
                <div class="kpi-item"><small>LOCATION & CHANNEL</small><b>${esc(r.transaction.location)}</b><span>${r.transaction.card_present ? 'Physical Card' : 'Online (CNP)'}</span></div>
                <div class="kpi-item"><small>IP & NETWORK</small><b>${esc(r.transaction.ip_address)}</b><span>${r.transaction.ip_is_proxy ? 'Anonymizing Proxy' : 'Verified Network'}</span></div>
                <div class="kpi-item"><small>STATUS & TIME</small><b>${esc(r.transaction.status)}</b><span>${esc(new Date(r.transaction.timestamp).toLocaleDateString())}</span></div>
            </div>` : '';

            let actionBtn = r.riskLevel === 'Low' ?
                `<button class="analyst-action escalate" type="button" data-action="escalate" data-transaction-id="${esc(r.transactionId)}">Escalate review</button>` :
                `<button class="analyst-action freeze" type="button" data-action="freeze-card" data-transaction-id="${esc(r.transactionId)}">Freeze card</button>`;

            let signalsHtml = (r.signals || []).map(s => `
                <li class="signal-row">
                    <div class="sig-header">
                        <span class="sig-badge ${(r.riskLevel || 'low').toLowerCase()}">${esc(s.name)} (+${s.score})</span>
                        <span class="sig-ev">${esc(s.evidence)}</span>
                    </div>
                    <small class="sig-why">${esc(signalWhy(s, r.avgTransactionAmount))}</small>
                </li>
            `).join('');

            let policiesHtml = (r.policies || []).map((p, i) => `
                <li class="policy-item">
                    <button class="policy-link" type="button" data-target="policy-${i}" aria-expanded="false">
                        <span class="p-title">${esc(p.section)}</span>
                        <span class="p-right">${p.relevance ? `<span class="p-match">${p.relevance}% match</span>` : ''} <span>View details →</span></span>
                    </button>
                    <div id="policy-${i}" class="policy-detail" hidden>
                        <b>${esc(p.section)}</b>
                        <p>${esc(p.text)}</p>
                    </div>
                </li>
            `).join('');

            let bodyContent = isClean ? `
                <div class="txn-clean-notice">
                    <b>✓ Clean Transaction Assessment</b>
                    <p>${esc(r.summary)}</p>
                </div>
            ` : `
                <div class="txn-signals-section">
                    <div class="col-head"><b>Why it was declined (${r.signals.length} signals)</b></div>
                    <ul class="signals-2col-grid">${signalsHtml}</ul>
                </div>
                ${policiesHtml ? `
                <div class="txn-policies-section">
                    <div class="col-head"><b>Related Policy Rules</b></div>
                    <ul class="policies-list">${policiesHtml}</ul>
                </div>` : ''}
                <div class="recommend-box">
                    <small>RECOMMENDED NEXT STEP</small>
                    <p>${esc(r.recommendation)}</p>
                </div>
            `;

            let llmBlock = r.llmExplanation ? `<div class="llm-explanation"><b>AI Investigation Summary</b><p>${esc(r.llmExplanation)}</p></div>` : '';

            return `
            <article class="message bot">
                <div class="avatar">R</div>
                <div class="card">
                    <div class="cardtop">
                        <div>
                            <small>TRANSACTION INVESTIGATION</small>
                            <b>${esc(r.transactionId)} · ${esc(r.transaction ? r.transaction.merchant : '')}</b>
                            <span class="sub-user">${esc(r.customerName)} (${esc(r.transaction ? r.transaction.user_id : '')})</span>
                        </div>
                        <div class="top-actions">
                            <div class="risk ${(r.riskLevel || 'low').toLowerCase()}">${esc(r.riskLevel || 'Low')} <strong>${r.riskScore || 0}</strong></div>
                            ${actionBtn}
                        </div>
                    </div>
                    ${llmBlock}
                    ${kpis}
                    ${bodyContent}
                </div>
            </article>`;
        }
        async function send(t) {
            if (!t.trim()) return;
            const sampleSection = document.querySelector('.sample');
            if (sampleSection) sampleSection.remove();

            user(t);
            input.value = '';
            let load = document.createElement('article');
            load.className = 'message bot';
            load.innerHTML = '<div class="avatar">R</div><div class="bubble">Investigating transaction evidence...</div>';
            messages.append(load);
            try {
                let res = await fetch('/api/investigate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: t })
                });
                load.outerHTML = card(await res.json());
            } catch {
                load.outerHTML = '<article class="message bot"><div class="avatar">R</div><div class="bubble">Unable to reach the investigation service. Please try again.</div></article>';
            }
            messages.scrollTop = messages.scrollHeight;
        }
        form.onsubmit = e => { e.preventDefault(); send(input.value) }; document.querySelectorAll('[data-question]').forEach(b => b.onclick = () => send(b.dataset.question));
        messages.addEventListener('click', async event => {
            let action = event.target.closest('.analyst-action');
            if (action) {
                let actionType = action.dataset.action;
                let txnId = action.dataset.transactionId;
                let isFreeze = actionType === 'freeze-card';
                let queryText = isFreeze ? 'Freeze Card' : 'Escalate review';

                action.disabled = true;
                action.textContent = isFreeze ? 'Card Frozen' : 'Escalated';

                const sampleSection = document.querySelector('.sample');
                if (sampleSection) sampleSection.remove();

                // Post user message bubble to chat
                user(queryText);

                // Add bot loading bubble
                let load = document.createElement('article');
                load.className = 'message bot';
                load.innerHTML = `<div class="avatar">R</div><div class="bubble">Processing ${queryText.toLowerCase()} for ${esc(txnId)}...</div>`;
                messages.append(load);
                messages.scrollTop = messages.scrollHeight;

                try {
                    let res = await fetch(`/api/transactions/${encodeURIComponent(txnId)}/${actionType}`, { method: 'POST' });
                    let data = await res.json();
                    let replyText = data.message || data.error || 'Action completed.';
                    load.outerHTML = `<article class="message bot"><div class="avatar">R</div><div class="bubble">${esc(replyText)}</div></article>`;
                } catch {
                    load.outerHTML = `<article class="message bot"><div class="avatar">R</div><div class="bubble">Unable to process the request. Please try again.</div></article>`;
                }
                messages.scrollTop = messages.scrollHeight;
                return;
            }
            let riskFilter = event.target.closest('.risk-filter-button');
            if (riskFilter) { send(riskFilter.dataset.query); return }
            let transactionLink = event.target.closest('.risk-transaction-link');
            if (transactionLink) { send(`Investigate ${transactionLink.dataset.transactionId}`); return }
            let link = event.target.closest('.policy-link');
            if (!link) return;
            let detail = link.parentElement.querySelector('#' + link.dataset.target);
            detail.hidden = !detail.hidden;
            link.setAttribute('aria-expanded', String(!detail.hidden));
        });
    </script>
</body>

</html>
